<footer class="site-footer h-card">
  <data class="u-url" href="{{ '/' | relative_url }}"></data>
  <div class="wrapper footer-grid">
    <div>
      <p class="footer-name">{{ site.author | escape }}</p>
    </div>
    <nav class="footer-links" aria-label="Elsewhere">
      <a href="https://github.com/{{ site.github_username | cgi_escape | escape }}" target="_blank" rel="noopener noreferrer">GitHub</a>
      <a href="https://{{ site.bandcamp_username | cgi_escape | escape }}.bandcamp.com" target="_blank" rel="noopener noreferrer">Bandcamp</a>
      <a href="https://soundcloud.com/{{ site.soundcloud_username | cgi_escape | escape }}" target="_blank" rel="noopener noreferrer">SoundCloud</a>
      <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
    </nav>
  </div>
</footer>
